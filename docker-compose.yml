services:
  tutor_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_learning_buddy_container
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - PORT=8501
      - LOG_LEVEL=INFO
    restart: unless-stopped
